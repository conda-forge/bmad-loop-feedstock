# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.12.0"

package:
  name: bmad-loop
  version: ${{ version }}

source:
  url: https://github.com/bmad-code-org/bmad-loop/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8a299a049aa1e276fd09a68e51b0c2ca3301e0df6f264c68cff32ca27ee6b41c

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - bmad-loop = bmad_loop.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling >=1.30
  run:
    - __unix
    - python >=${{ python_min }}
    - pyyaml >=6.0
    - regex >=2024.11.6
    - psutil >=7.2.2  # non-linux
    - tmux >=3.2  # or herdr or psmux
    - textual >=8.0,<9  # tui
    - tomlkit >=0.13  # tui
    - pyte >=0.8.2  # tui
    - rich >=14.2  # tui
    - httpx >=0.28  # opencode
  run_constraints:
    - herdr

tests:
  - python:
      imports:
        - bmad_loop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - bmad-loop --version
      - bmad-loop --help

about:
  summary: Deterministic ralph-loop orchestrator for the BMAD implementation phase
  description: |
    bmad-loop drives the BMAD Method implementation phase as a
    deterministic outer loop: for each story in the sprint plan it
    dispatches DEV -> VERIFY -> REVIEW -> VERIFY -> COMMIT stages in
    fresh agent sessions (tmux-multiplexed), gating progression on
    configurable policy (.bmad-loop/policy.toml). Includes a Textual
    TUI dashboard (`bmad-loop tui`) for live run monitoring.
  homepage: https://github.com/bmad-code-org/bmad-loop
  repository: https://github.com/bmad-code-org/bmad-loop
  documentation: https://github.com/bmad-code-org/bmad-loop#readme
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
